[package]
name = "nexus-exodus-launcher"
version = "0.1.0"
description = "Secure Nexus Exodus WebClient launcher prototype"
authors = ["Nexus Exodus contributors"]
edition = "2021"

[lib]
name = "nexus_exodus_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
open = "5.3.2"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
tauri = { version = "2.8.5", features = [] }
thiserror = "2.0.16"
url = "2.5.7"
