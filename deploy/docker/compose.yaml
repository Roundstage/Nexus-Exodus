services:
  nexus-exodus:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: "nexus-exodus:${NEXUS_IMAGE_TAG:-playtest-516.1686}"
    platform: linux/amd64
    restart: unless-stopped
    init: true
    ports:
      # Traefik runs in host-network mode and proxies public TCP 50000 to this
      # loopback-only backend. Override these values only for isolated staging.
      - "${NEXUS_BIND_ADDRESS:-127.0.0.1}:${NEXUS_BACKEND_PORT:-50001}:50000/tcp"
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; connection = socket.create_connection(('127.0.0.1', 50000), 3); connection.close()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    volumes:
      - nexus_state:/srv/nexus
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    stop_grace_period: 90s

volumes:
  nexus_state:
