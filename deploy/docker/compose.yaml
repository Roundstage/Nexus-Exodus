services:
  nexus-exodus:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: "nexus-exodus:${NEXUS_IMAGE_TAG:-playtest-516.1686}"
    platform: linux/amd64
    restart: unless-stopped
    init: true
    ports:
      - "${NEXUS_PORT:-50000}:50000/tcp"
    volumes:
      - nexus_state:/srv/nexus
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    stop_grace_period: 90s

volumes:
  nexus_state:
